<!DOCTYPE html>
<html>
    <head>
        <title>Lab 3</title>

         <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
           integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
           crossorigin=""/>

         <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
           integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
           crossorigin=""></script>
	
		<script type="text/javascript" src="data.js"></script>
	
	<style>
		.legend {
		  padding: 6px 8px;
		  line-height: 25 px;
		  background: rgba(255,255,255,0.9);
		  box-shadow: 0 0 15px rgba(0,0,0,0.2);
		  border-radius: 5px;
				}
	   
	   .legend i {
		  width: 25 px;
		  height: 25 px;
		  float: left;
		  margin-right: 8px;
		  opacity: 0.7;
				 }
	</style>

    </head>

    <body>
        <div id="map" style="height: 1000px"></div>

        <script type="text/javascript">

          var map = L.map('map', {
              center: [41.817,-87.902],
              zoom: 10
          });

          L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
               attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>',
               maxZoom: 11,
               minZoom: 5
            }).addTo(map);
		
			
		function getColor(value) {
		return value > 8257 ? '#006d2c':
			   value > 5368  ? '#2ca25f':
			   value > 3852  ? '#66c2a4':
			   value > 1847  ? '#b2e2e2':
							 '#edf8fb';
		
							}			
	
	
	function style(feature){
		return {
			fillColor: getColor(feature.properties.PopDen),   // PopDen is the field name for the Chicago population density data
			weight: 2,
			opacity: 1,
			color: 'grey',
			dashArray: '4',
			fillOpacity: 0.9
				};
							}
													
		
			function highlightFeature(e) {
			// Get access to the feature that was hovered through e.target
			var feature = e.target;

			// Set a thick grey border on the feature as mouseover effect
			// Adjust the values below to change the highlighting styles of features on mouseover
			// Check out https://leafletjs.com/reference.html#path for more options for changing style
			feature.setStyle({
				weight: 5,
				color: '#fff',
				fillOpacity: 0.7
			});

			// Bring the highlighted feature to front so that the border doesn’t clash with nearby states
			// But not for IE, Opera or Edge, since they have problems doing bringToFront on mouseover
			if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) 
			{feature.bringToFront();}					
										}	
										
			
			function onEachFeature(feature, layer) {
				layer.on({
					mouseover: highlightFeature, // Do what defined by the highlightFeature function on mouseover
					mouseout: resetHighlight,    // Do what defined by the resetHighlight function on mouseout
						});
													}							
		var geojson; // define a variable to make the geojson layer accessible for the funtion to use   
			function resetHighlight(e) 		{
			geojson.resetStyle(e.target);	}
				
				
		geojson = L.geoJson(data, {
			style:style
		 ,onEachFeature: onEachFeature
				}).bindTooltip(function (layer){
		return layer.feature.properties.community 
				+ '<p style="color:purple">' + layer.feature.properties.PopDen.toString() + '<br> people/square Km </p>';       
				}).addTo(map);
			
			
		var legend = L.control({position: 'topleft'}); // Try the other three corners if you like.

		legend.onAdd = function (map) {

		var div = L.DomUtil.create('div', 'legend'),
			grades = [0, 1847, 3852, 5368, 8257]; // The break values to define the intervals of population, note we begin from 0 here

		div.innerHTML = '<b>2010 Chicago Population Density<br> by Neighborhood<br></b>'; // The legend title (HTML-based), in this case it's Population Density 2011

		// Loop through our the classes and generate a label with a color box for each interval.
		// If you are creating a choropleth map, you DO NOT need to change lines below.
		for (var i = 0; i < grades.length; i++) {
			div.innerHTML +=
			'<i style="background:' + getColor(grades[i] + 1) + '"></i>' +
			grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
		}

		return div;
	};

	legend.addTo(map);
			</script>
	</body>
	</html>
